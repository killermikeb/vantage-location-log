name: Deploy Pages (production)

# Publishes the repo's static files (no build step) to the root of the
# gh-pages branch, which GitHub Pages serves. `keep_files: true` is required
# so this doesn't delete the pr-preview/ subdirectories that
# deploy-preview.yml maintains on the same branch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to gh-pages (production root)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          keep_files: true
