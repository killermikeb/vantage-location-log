name: Deploy Pages (PR preview)

# Publishes a preview of the PR's branch to gh-pages under
# pr-preview/pr-<number>/, alongside (not replacing) the production site
# that deploy-production.yml keeps at the branch root. Posts/updates a
# sticky comment on the PR with the preview link, and removes the preview
# directory automatically when the PR closes.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./
          preview-branch: gh-pages
          umbrella-dir: pr-preview

      # pr-preview-action's removal step (above, on closed) deletes the
      # preview's real content but reliably leaves behind the .nojekyll
      # marker files it wrote into pr-preview/pr-<number>/ and its
      # temp-deployment-folder subdirectory, since those aren't part of
      # source-dir. Sweep the now-empty directory away so gh-pages doesn't
      # accumulate stray folders across every closed PR.
      - name: Checkout gh-pages for cleanup
        if: github.event.action == 'closed'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-cleanup

      - name: Remove stray preview leftovers
        if: github.event.action == 'closed'
        working-directory: gh-pages-cleanup
        run: |
          DIR="pr-preview/pr-${{ github.event.pull_request.number }}"
          if [ -d "$DIR" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -rf --ignore-unmatch "$DIR"
            if ! git diff --cached --quiet; then
              git commit -m "Clean up stray pr-${{ github.event.pull_request.number }} preview leftovers"
              git push origin HEAD:gh-pages
            fi
          fi
